[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abadia-del-crimen"
version = "0.1.0"
description = "Tools and disassembly analysis for Abadía del Crimen"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Pillow>=10.0.0",  # Image processing for sprite/tile extraction
    "click>=8.0.0",    # CLI framework
    "numpy>=1.24.0",   # Array operations
    "pygame>=2.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = [
    "python_scripts/src/engine",
    "python_scripts/src/game",
    "python_scripts/src/data",
    "python_scripts/src/tools",
    "python_scripts/src/codegen",
]

[tool.ruff]
line-length = 88
target-version = "py38"
src = ["python_scripts/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.pytest.ini_options]
addopts = "--cov=engine --cov=game --cov=data --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["python_scripts/src"]
